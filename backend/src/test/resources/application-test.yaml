spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=YEAR
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    show-sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

  cache:
    type: simple
    cache-names:
      - movieSearch
      - moviesByGenre
      - moviesByFirstLetter
      - movieDetails
      - autocompleteTitles
      - topRatedMovies
      - starDetails

server:
  port: 8443
  ssl:
    enabled: false

frontend:
  url: https://localhost:4200
