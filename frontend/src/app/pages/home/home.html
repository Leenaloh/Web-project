<div class="min-vh-100 bg-light bg-gradient" data-testid="page-home">
  <div class="container-fluid px-0">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold fs-2" routerLink="/home">
          <img src="/logo.png" alt="Filmly logo" width="48" height="48" class="object-fit-contain me-n2" />
          <span>ilmly</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          (click)="isMenuOpen = !isMenuOpen"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 fw-bold">
            <li class="nav-item">
              <a class="nav-link active text-danger" routerLink="/home" (click)="isMenuOpen = false" data-testid="link-home">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/cart" (click)="isMenuOpen = false" data-testid="link-cart">Cart</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/login" (click)="isMenuOpen = false" data-testid="link-logout">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="py-5">
      <div class="container py-4">
        <div class="row">
          <div class="col-12 col-lg-8">
            <span class="badge rounded-pill text-danger bg-danger bg-opacity-10 border border-danger px-3 py-2 mb-3">
              Browse • Search • Discover
            </span>

            <h1 class="display-4 fw-bold lh-1 mb-0">
              Find your next movie in seconds
            </h1>
          </div>
        </div>
      </div>
    </section>

    <section class="pb-5">
      <div class="container">
        <div class="card border-0 shadow rounded-4 p-4 p-lg-5" data-testid="panel-search">

          <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-2 mb-4">
            <div>
              <h2 class="h4 fw-bold mb-1">Search Movies</h2>
              <p class="text-secondary mb-0">
                Type a movie title for suggestions, or filter by genre and first letter.
              </p>
            </div>
          </div>

          <div class="row g-3 align-items-end">

            <div class="col-12 col-lg-6 position-relative">
              <label for="movieTitle" class="form-label fw-semibold">Movie Title</label>

              <input
                id="movieTitle"
                class="form-control form-control-lg rounded-4"
                [(ngModel)]="form.title"
                (input)="onTitleInput()"
                (blur)="hideSuggestions()"
                placeholder="Type a title..."
                autocomplete="off"
                data-testid="input-title" />

              <div
                class="position-absolute start-0 end-0 mx-3 mt-2 bg-white border rounded-4 shadow overflow-hidden z-3"
                *ngIf="showSuggestions">

                <button
                  type="button"
                  class="btn btn-light w-100 text-start rounded-0 border-0 px-3 py-2"
                  *ngFor="let suggestion of titleSuggestions"
                  (mousedown)="selectSuggestion(suggestion)">
                  {{ suggestion }}
                </button>
              </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
              <label for="genre" class="form-label fw-semibold">Genre</label>

              <select
                id="genre"
                class="form-select rounded-4"
                [(ngModel)]="selectedGenreString">

                <option value="">All genres</option>

                <option *ngFor="let g of genres" [value]="g.id">
                  {{ g.name }}
                </option>
              </select>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
              <label for="letter" class="form-label fw-semibold">Starts With</label>

              <select
                id="letter"
                class="form-select rounded-4"
                [(ngModel)]="selectedTitleChar">

                <option value="">Letter</option>

                <option *ngFor="let c of titleChars" [value]="c">
                  {{ c }}
                </option>
              </select>
            </div>

            <div class="col-12 col-md-6">
              <label for="director" class="form-label fw-semibold">Director</label>

              <input
                id="director"
                class="form-control rounded-4"
                [(ngModel)]="form.director"
                placeholder="Search by director"
                data-testid="input-director" />
            </div>

            <div class="col-12 col-md-6">
              <label for="star" class="form-label fw-semibold">Star Name</label>

              <input
                id="star"
                class="form-control rounded-4"
                [(ngModel)]="form.starName"
                placeholder="Search by star"
                data-testid="input-star" />
            </div>

            <div class="col-12 col-md-6 col-lg-3">
              <label for="year" class="form-label fw-semibold">Year</label>

              <input
                id="year"
                class="form-control rounded-4"
                [(ngModel)]="form.year"
                placeholder="e.g. 1994"
                data-testid="input-year" />
            </div>

            <div class="col-12 col-lg-9">
              <div
                class="d-flex flex-column flex-sm-row justify-content-lg-end gap-2 mt-lg-4"
                data-testid="actions-search">

                <button
                  class="btn btn-danger rounded-pill fw-semibold px-4"
                  (click)="search()"
                  data-testid="btn-search">
                  Search
                </button>

                <button
                  class="btn btn-outline-danger rounded-pill fw-semibold px-4"
                  (click)="clear()"
                  data-testid="btn-clear">
                  Clear
                </button>
              </div>
            </div>
          </div>

          <div data-testid="msg-success" hidden></div>
          <div data-testid="msg-error" hidden></div>

        </div>
      </div>
    </section>
  </div>
</div>
