<div class="page">
  <div class="card">
    <h1>Login</h1>

    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="email" type="text" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" type="password" />
    </div>

    <button class="btn btn-primary" (click)="login()">Login</button>
  </div>
</div>
