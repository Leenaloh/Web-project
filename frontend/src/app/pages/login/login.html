<div class="page" data-testid="page-login">
  <div class="card">
    <h1 data-testid="heading-login-title">Login</h1>

    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="email" type="text" data-testid="input-email" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" type="password" data-testid="input-password" />
    </div>

    <button class="btn btn-primary" (click)="login()" data-testid="btn-login">Login</button>
    <div data-testid="msg-success" hidden></div>
    <div data-testid="msg-error" hidden></div>
  </div>
</div>
