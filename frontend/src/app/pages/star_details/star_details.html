<div class="min-vh-100 bg-light bg-gradient" data-testid="page-star-details">
  <div class="container-fluid px-0">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold fs-2" routerLink="/home">
          <img src="/logo.png" alt="Filmly logo" width="48" height="48" class="object-fit-contain me-n2" />
          <span>ilmly</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          (click)="isMenuOpen = !isMenuOpen"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3 fw-bold">
            <li class="nav-item">
              <a class="nav-link" routerLink="/home" (click)="isMenuOpen = false" data-testid="link-home">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/cart" (click)="isMenuOpen = false" data-testid="link-cart">Cart</a>
            </li>
            <li class="nav-item">
<button class="nav-link btn btn-link" type="button" (click)="logout()">
  Logout
</button>            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="bg-white bg-opacity-75 py-5 border-bottom" *ngIf="star">
      <div class="container-xl py-4">
        <span class="badge rounded-pill text-danger bg-danger bg-opacity-10 border border-danger px-3 py-2 mb-3">
          Star Profile
        </span>

        <h1
          class="display-5 fw-bold mb-2"
          [attr.data-testid]="'heading-star-name-' + star.id">
          {{ star.name }}
        </h1>

        <p
          class="text-secondary fs-5 mb-0"
          [attr.data-testid]="'star-birth-year-' + star.id">
          Born {{ star.birthYear || 'N/A' }}
          <span *ngIf="star.birthYear">
            (Age {{ 2026 - star.birthYear }})
          </span>
        </p>
      </div>
    </section>

    <section class="py-5" *ngIf="star">
      <div class="container-xl">
        <div class="card border-0 shadow rounded-4 p-4 p-lg-5">

          <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
              <h2 class="h4 fw-bold mb-1" data-testid="heading-star-movies">
                Movies
              </h2>
              <p class="text-secondary mb-0">Movies featuring this star</p>
            </div>
          </div>

          <div class="alert alert-light border rounded-4 mb-0" *ngIf="movies.length === 0">
            No movies found for this star.
          </div>

          <div class="row g-4" data-testid="star-movie-list" *ngIf="movies.length > 0">
            <div
              class="col-12 col-md-6 col-xl-4"
              *ngFor="let m of movies; let i = index"
              [attr.data-testid]="'movie-item-' + (m.id || i)">

              <button
                type="button"
                class="btn btn-outline-danger w-100 text-start rounded-4 p-4 h-100"
                (click)="goMovie(m.id)"
                [attr.data-testid]="'movie-link-' + (m.id || i)">

                <h3 class="h5 fw-bold mb-3">
                  {{ m.title }}
                </h3>

                <div class="row gy-2">
                  <div class="col-6 text-secondary text-uppercase fw-bold small" *ngIf="m.year">
                    Year
                  </div>
                  <div class="col-6 text-end fw-bold" *ngIf="m.year">
                    {{ m.year }}
                  </div>

                  <div class="col-6 text-secondary text-uppercase fw-bold small" *ngIf="m.director">
                    Director
                  </div>
                  <div class="col-6 text-end fw-bold" *ngIf="m.director">
                    {{ m.director }}
                  </div>
                </div>

              </button>
            </div>
          </div>

          <div data-testid="msg-success" hidden></div>
          <div data-testid="msg-error" hidden></div>

        </div>
      </div>
    </section>

  </div>
</div>
