<div class="container" data-testid="page-cart">
  <h2 class="title" data-testid="heading-cart-title">Shopping Cart</h2>

  <div class="box">
    <table class="table" data-testid="cart-table">
      <thead>
        <tr>
          <th>Movie</th>
          <th class="center">Quantity</th>
          <th class="center">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of cart.items; let i = index" [attr.data-testid]="'cart-row-' + (item.movieId || i)">
          <td [attr.data-testid]="'cart-item-title-' + (item.movieId || i)">{{ item.title }}</td>
          <td class="center">
            <button
              class="qty-btn"
              (click)="decrease(item.movieId, item.quantity)"
              [attr.data-testid]="'btn-update-qty-dec-' + (item.movieId || i)">
              -
            </button>
            <input class="qty" [value]="item.quantity" readonly [attr.data-testid]="'input-qty-' + (item.movieId || i)" />
            <button
              class="qty-btn"
              (click)="increase(item.movieId, item.quantity)"
              [attr.data-testid]="'btn-update-qty-inc-' + (item.movieId || i)">
              +
            </button>
          </td>
          <td class="center">
            <button class="btn btn-danger" (click)="remove(item.movieId)" [attr.data-testid]="'btn-remove-' + (item.movieId || i)">Remove</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="actions-row" data-testid="cart-actions">
      <button class="btn btn-secondary" (click)="clear()" data-testid="btn-clear">Clear Cart</button>
      <a class="link" routerLink="/movie_list" data-testid="btn-continue-shopping">Continue Shopping</a>
      <button class="btn btn-success" (click)="checkout()" data-testid="btn-checkout">Proceed to Checkout</button>
    </div>
    <div data-testid="msg-success" [hidden]="!success">{{ success }}</div>
    <div data-testid="msg-error" [hidden]="!error">{{ error }}</div>
  </div>
</div>
