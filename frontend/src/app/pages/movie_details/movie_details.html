<div class="app-background" data-testid="page-movie-details">
  <div class="container-fluid px-0">
    <nav class="navbar navbar-expand-lg app-navbar">
      <div class="container">
        <a class="navbar-brand app-brand" routerLink="/home">
          <img src="/logo.png" alt="Filmly logo" class="app-brand-logo" />
          <span class="app-brand-text">ilmly</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          (click)="isMenuOpen = !isMenuOpen"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
            <li class="nav-item">
              <a class="nav-link" routerLink="/home" (click)="isMenuOpen = false" data-testid="link-home">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/cart" (click)="isMenuOpen = false" data-testid="link-cart">Cart</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/login" (click)="isMenuOpen = false" data-testid="link-logout">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <ng-container *ngIf="movie as movie">
      <section class="page-hero details-hero">
        <div class="container">
          <span class="page-badge">Movie Details</span>

          <div class="row align-items-start g-5">
            <div class="col-lg-8">
              <h1 class="page-hero-title" [attr.data-testid]="'heading-movie-title-' + movie.id">
                {{ movie.title }}
              </h1>

              <p class="movie-meta">
                <span>Year</span> {{ movie.year || 'N/A' }}
                <span class="dot">•</span>
                <span>Director</span> {{ movie.director || 'N/A' }}
                <span class="dot">•</span>
                <span>Rating</span> {{ movie.rating ?? 'N/A' }}/10
              </p>

              <div class="genre-tags" *ngIf="movie.genres && movie.genres.length">
                <span *ngFor="let g of movie.genres">{{ g }}</span>
              </div>
            </div>

            <div class="col-lg-4">
              <div class="hero-cart-box">
                <h2 class="cart-heading" data-testid="heading-add-to-cart">Add to Cart</h2>

                <div class="cart-qty-row" data-testid="qty-controls">
                  <button
                    type="button"
                    class="qty-chip"
                    (click)="dec()"
                    data-testid="btn-update-qty-dec">
                    −
                  </button>

                  <span class="qty-display" data-testid="input-qty">{{ qty }}</span>

                  <button
                    type="button"
                    class="qty-chip"
                    (click)="inc()"
                    data-testid="btn-update-qty-inc">
                    +
                  </button>
                </div>

                <button
                  class="btn btn-primary cart-main-btn"
                  (click)="add()"
                  data-testid="btn-add-to-cart">
                  Add to Cart
                </button>

                <div class="alert alert-success mt-3" data-testid="msg-success" [hidden]="!success">
                  {{ success }}
                </div>

                <div class="alert alert-danger mt-3" data-testid="msg-error" [hidden]="!addError">
                  {{ addError }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="cast-section">
        <div class="container">
          <h2 class="section-title mb-4" data-testid="heading-stars">Cast</h2>

          <div class="empty-state" *ngIf="!movie.stars || movie.stars.length === 0">
            No stars found for this movie.
          </div>

          <div class="cast-list" data-testid="star-list">
            <button
              type="button"
              *ngFor="let s of movie.stars"
              class="cast-chip"
              (click)="goStar(s.id)"
              [attr.data-testid]="'star-link-' + s.id">
              {{ s.name }}
            </button>
          </div>
        </div>
      </section>
    </ng-container>

    <section class="py-5" *ngIf="!movie && error">
      <div class="container">
        <div class="alert alert-danger mb-0">
          {{ error }}
        </div>
      </div>
    </section>
  </div>
</div>
