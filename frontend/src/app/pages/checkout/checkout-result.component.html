<div class="app-background">
  <div class="result-page">
    <div class="result-card">
      <span class="page-badge">Payment Confirmed</span>
      <h1>Checkout Successful</h1>
      <p>Your rental order was placed successfully.</p>

      <div class="result-details">
        <div class="detail-row">
          <span>Order ID</span>
          <strong>#{{ orderId.slice(0, 8) }}</strong>
        </div>
        <div class="detail-row">
          <span>Status</span>
          <strong>{{ status }}</strong>
        </div>
        <div class="detail-row">
          <span>Total Items</span>
          <strong>{{ totalItems }}</strong>
        </div>
        <div class="detail-row">
          <span>Total Amount</span>
          <strong>{{ totalAmount | currency }}</strong>
        </div>
      </div>

      <a routerLink="/home" class="back-btn">Back to Home</a>
    </div>
  </div>
</div>
