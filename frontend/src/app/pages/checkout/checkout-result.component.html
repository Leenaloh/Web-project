<div class="min-vh-100 bg-light d-flex align-items-center py-5">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">

        <div class="card border-0 shadow rounded-4 p-4 p-md-5 text-center">

          <span
            class="badge rounded-pill text-danger bg-danger bg-opacity-10 border border-danger px-3 py-2 mb-3 align-self-center">
            Payment Confirmed
          </span>

          <h1 class="display-5 fw-bold mb-3">
            Checkout Successful
          </h1>

          <p class="text-secondary mb-5">
            Your rental order was placed successfully.
          </p>

          <div class="border rounded-4 overflow-hidden">

            <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
              <span class="fw-semibold text-secondary">
                Order ID
              </span>

              <strong>
                #{{ orderId.slice(0, 8) }}
              </strong>
            </div>

            <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
              <span class="fw-semibold text-secondary">
                Status
              </span>

              <strong>
                {{ status }}
              </strong>
            </div>

            <div class="d-flex justify-content-between align-items-center p-3">
              <span class="fw-semibold text-secondary">
                Total Items
              </span>

              <strong>
                {{ totalItems }}
              </strong>
            </div>

          </div>

          <div class="mt-5">
            <a
              routerLink="/home"
              class="btn btn-danger rounded-pill px-5 py-3 fw-semibold">
              Back to Home
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
