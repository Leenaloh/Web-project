name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moviedb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moviedb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install PostgreSQL client
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load database schema
        working-directory: .
        env:
          PGPASSWORD: 1234
        run: psql -h localhost -U postgres -d moviedb -f db/createtable.sql

      - name: Load database data
        working-directory: .
        env:
          PGPASSWORD: 1234
        run: psql -h localhost -U postgres -d moviedb -f db/movie-data.sql

      - name: Grant backend Gradle permission
        working-directory: backend
        run: chmod +x gradlew

      - name: Start backend server
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/moviedb
          DB_USER: postgres
          DB_PASSWORD: 1234
        run: nohup ./gradlew bootRun > ../backend.log 2>&1 &

      - name: Wait for backend
        working-directory: .
        run: |
          for i in {1..60}; do
            if curl -k --fail https://localhost:8443/api/v1/movies?pageSize=1 >/dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat backend.log
          exit 1

      - name: Start frontend server
        run: nohup npm start > ../frontend.log 2>&1 &
        env:
          CI: true

      - name: Wait for frontend
        working-directory: .
        run: |
          for i in {1..60}; do
            if curl -k --fail https://localhost:4200 >/dev/null 2>&1; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"
          cat frontend.log
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
